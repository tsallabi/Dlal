<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
body{font:13px Tahoma,Arial;width:340px;margin:0;padding:12px;color:#1a1a1a}h1{font-size:16px;margin:0 0 8px;color:#B05A20}
label{display:block;font-weight:700;margin:8px 0 3px}input{width:100%;box-sizing:border-box;padding:7px;border:1px solid #ccc;border-radius:6px;direction:ltr}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;color:#fff;background:#1a1a1a;margin-top:8px}.btn.brand{background:#B05A20}.btn.ghost{background:#eee;color:#1a1a1a}
.st{background:#f7f5f6;border-radius:8px;padding:8px;margin:8px 0;font-size:12px}.log{max-height:160px;overflow:auto;font-size:11px;color:#444;white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:6px;padding:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px}
.dash{display:block;text-align:center;text-decoration:none;background:#B05A20;color:#fff;border-radius:10px;padding:10px;font-weight:700;font-size:15px;margin:0 0 10px}
.dash small{display:block;font-weight:400;font-size:11px;opacity:.85;direction:ltr;margin-top:2px}
.pbar{height:12px;background:#eee;border-radius:999px;overflow:hidden;margin:6px 0 4px}.pbar i{display:block;height:100%;background:#B05A20;transition:width .6s}
.prog{background:#fff;border:1px solid #eee;border-radius:8px;padding:8px;margin:8px 0;font-size:12px}.prog .g{color:#444;margin-top:4px}
</style></head><body>
<h1>هدهد — زاحف 1688</h1>
<a class="dash" id="open" href="#">🕷 افتح لوحة الزاحف<small id="dashUrl"></small></a>
<div class="st" id="st">…</div>
<div class="prog" id="prog"><b id="progHead">شريط التقدّم…</b><div class="pbar"><i id="progBar" style="width:0%"></i></div><div id="progNums"></div><div class="g" id="progGain"></div></div>
<div><button class="btn brand" id="run">شغّل الآن</button> <button class="btn ghost" id="test">اختبار الاتصال</button> <button class="btn ghost" id="probe">فحص صفحة 1688 المفتوحة</button> <button class="btn ghost" id="pause">إيقاف مؤقت</button></div>
<div class="st" id="testres" style="display:none"></div>
<details><summary style="cursor:pointer;margin-top:10px;font-weight:700">الإعدادات</summary>
<label>عنوان موقع هدهد</label><input id="api" placeholder="https://dlal.tsallabi.workers.dev">
<label>رمز الاستيراد (IMPORT_TOKEN)</label><input id="token" type="password">
<button class="btn" id="save">حفظ</button></details>
<label>السجل</label><div class="log" id="log"></div>
<script src="popup.js"></script></body></html>
