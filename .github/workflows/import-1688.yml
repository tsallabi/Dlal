# استيراد منتج حقيقي من 1688 إلى الموقع الحي (يعمل من خوادم GitHub التي تصل إلى 1688)
name: Import from 1688
on:
  workflow_dispatch:
    inputs:
      target:
        description: رابط منتج 1688 أو كلمة بحث بالصينية
        default: 连衣裙 女
        required: true
      category:
        description: slug القسم في هدهد
        default: dresses
        required: true
      base:
        description: رابط الموقع
        default: https://dlal.tsallabi.workers.dev
        required: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Import
        env:
          BASE: ${{ github.event.inputs.base }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: node scripts/import-1688.mjs "${{ github.event.inputs.target }}" "${{ github.event.inputs.category }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shot-*.png, if-no-files-found: ignore }
