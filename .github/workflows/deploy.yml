# نشر دلال على Cloudflare Workers عند كل دفع إلى main (أو يدويًا)
# يلزم إضافة الأسرار في GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (صلاحيات: Workers Scripts:Edit, D1:Edit, Account Settings:Read)
#   CLOUDFLARE_ACCOUNT_ID
#   ADMIN_PASSWORD, SESSION_SECRET, IMPORT_TOKEN (اختيارية — تُضبط كأسرار للـ Worker)
#   MYPAY_API_KEY, MYPAY_WEBHOOK_SECRET (اختيارية)
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Package browser extension
        run: (cd extension && zip -qr ../public/dlal-extension.zip .) && ls -la public/dlal-extension.zip
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply dlal-db --remote
      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Set Worker secrets (only those provided)
        run: |
          for s in ADMIN_PASSWORD SESSION_SECRET IMPORT_TOKEN MYPAY_API_KEY MYPAY_WEBHOOK_SECRET; do
            v="${!s}"; if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$s"; fi
          done
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          MYPAY_API_KEY: ${{ secrets.MYPAY_API_KEY }}
          MYPAY_WEBHOOK_SECRET: ${{ secrets.MYPAY_WEBHOOK_SECRET }}
      - name: Summary
        run: echo "### 🚀 نُشر دلال على ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
