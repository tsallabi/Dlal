# فحص الموقع الحي بعد النشر: يفتح الصفحات الأساسية ويتأكد من المحتوى
name: Smoke test live site
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL
        default: https://dlal.tsallabi.workers.dev
        required: true
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check pages
        env:
          BASE: ${{ github.event.inputs.url || 'https://dlal.tsallabi.workers.dev' }}
        run: |
          fail=0
          for p in / /c/dresses /c/bags /login /register /pages/faq /pages/returns /cart /wishlist; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$BASE$p")
            echo "$code  $p"
            [ "$code" = "200" ] || fail=1
          done
          code=$(curl -s -G --data-urlencode 'q=فستان' -o /tmp/s.html -w '%{http_code}' "$BASE/search"); echo "$code  /search?q=فستان"; [ "$code" = "200" ] || fail=1
          grep -q 'نتائج البحث' /tmp/s.html && echo "search results OK" || fail=1
          echo "--- home content:"
          curl -s "$BASE/" > /tmp/home.html
          cards=$(grep -o 'class="card"' /tmp/home.html | wc -l)
          echo "product cards on home: $cards"; [ "$cards" -ge 20 ] || fail=1
          grep -q 'تالين' /tmp/home.html && echo "brand text OK" || fail=1
          grep -q 'فساتين' /tmp/home.html && echo "categories OK" || fail=1
          echo "--- product image proxy:"
          pimg=$(grep -oE '/img/[A-Za-z0-9_-]+' /tmp/home.html | head -1)
          if [ -n "$pimg" ]; then
            icode=$(curl -sL -o /tmp/p.img -w '%{http_code} %{content_type}' "$BASE$pimg")
            isize=$(stat -c%s /tmp/p.img)
            echo "$icode  $isize bytes"
            # الصورة الحقيقية أكبر بكثير من صورة البديل (placeholder.svg) — فحجم كبير يعني أن alicdn استجاب فعلًا
            case "$icode" in *image/*) [ "$isize" -gt 5000 ] && echo "image proxy serves real product photos" || { echo "PROXY FELL BACK TO PLACEHOLDER"; fail=1; } ;; *) echo "IMAGE PROXY NOT SERVING IMAGES"; fail=1 ;; esac
          else
            echo "no proxied image on home page"; fail=1
          fi
          grep -q 'alicdn.com' /tmp/home.html && { echo "SOURCE CDN LEAKED ON HOME"; fail=1; } || echo "home hides source cdn"
          # القاعدة الأولى: لا حرف صيني أمام الزبونة على أي صفحة تصفّح
          for p in / /c/dresses /c/bags /new /sale; do
            curl -s "$BASE$p" > /tmp/cn.html
            cn=$(python3 -c "import re,sys;h=open('/tmp/cn.html',encoding='utf-8',errors='ignore').read();b=re.sub(r'(?s)<script.*?</script>|<style.*?</style>','',h);t=re.sub(r'(?s)<[^>]+>',' ',b);m=re.findall(r'[一-鿿]',t);print(''.join(m[:20]))")
            if [ -n "$cn" ]; then echo "CHINESE TEXT ON $p: $cn"; fail=1; else echo "no chinese on $p"; fi
          done

          echo "--- browser extension package:"
          zcode=$(curl -sL -o /tmp/ext.zip -w '%{http_code}' "$BASE/talin-extension.zip")
          zsize=$(stat -c%s /tmp/ext.zip)
          echo "$zcode  /talin-extension.zip  ${zsize} bytes"
          [ "$zcode" = "200" ] && [ "$zsize" -gt 8000 ] || fail=1
          unzip -l /tmp/ext.zip | grep -q manifest.json && echo "extension zip has manifest" || fail=1
          unzip -l /tmp/ext.zip | grep -q config.js && echo "extension zip has auto-config script" || fail=1
          unzip -p /tmp/ext.zip manifest.json | grep -o '"version": *"[^"]*"' || fail=1
          echo "--- product page:"
          slug=$(grep -oE 'href="/p/[^"]+"' /tmp/home.html | head -1 | sed 's/href="\/p\/\(.*\)"/\1/')
          code=$(curl -s -o /tmp/p.html -w '%{http_code}' "$BASE/p/$slug"); echo "$code  /p/$slug"; [ "$code" = "200" ] || fail=1
          grep -q 'variantsJson' /tmp/p.html && echo "variants OK" || fail=1
          grep -q 'detail.1688.com' /tmp/p.html && { echo "SOURCE LINK LEAKED"; fail=1; } || echo "source hidden OK"
          echo "--- protected pages redirect:"
          for p in /admin /account /checkout; do code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p"); echo "$code  $p"; [ "$code" = "302" ] || fail=1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/p/not-exist"); echo "$code  /p/not-exist (expect 404)"; [ "$code" = "404" ] || fail=1
          echo "--- webhook rejects bad signature:"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-mypay-signature: bad' -d '{"event":"payment.success","trx_ref":"x"}' "$BASE/api/mypay/webhook"); echo "$code  webhook (expect 401)"; [ "$code" = "401" ] || fail=1
          echo "--- login as admin and open dashboard:"
          curl -s -c /tmp/cj -o /dev/null -X POST -d "phone=0910000000&password=${{ secrets.SMOKE_ADMIN_PASSWORD }}&next=/admin" "$BASE/login"
          code=$(curl -s -b /tmp/cj -o /tmp/admin.html -w '%{http_code}' "$BASE/admin"); echo "$code  /admin (logged in)"
          if [ -n "${{ secrets.SMOKE_ADMIN_PASSWORD }}" ]; then [ "$code" = "200" ] || fail=1; grep -q 'نظرة عامة' /tmp/admin.html && echo "admin dashboard OK" || fail=1; else echo "(SMOKE_ADMIN_PASSWORD not set — skipped)"; fi
          exit $fail
