# فحص حي لمزوّد 1688 API (OTAPI/TMAPI) المضبوط في /admin/source: جلب منتج، بحث، ثم تشغيل مهمة على الخادم
name: Source API check
on:
  workflow_dispatch:
    inputs:
      base:
        default: https://dlal.tsallabi.workers.dev
        required: true
      item_id:
        default: "828554317506"
        required: false
      keyword:
        default: "连衣裙 女 夏"
        required: false
      job_id:
        description: "crawl job id(s) to run on the server, comma separated (empty = skip; use - to skip item/keyword)"
        default: ""
        required: false
      translate:
        description: "re-translate N pending products with Workers AI (empty = skip)"
        default: ""
        required: false
      pages:
        description: "pages per job for this run (empty = the job's own setting)"
        default: ""
        required: false
      from_page:
        description: "start from this result page (use 2,3,4… to top up a thin category without refetching page 1)"
        default: ""
        required: false
      max_items:
        description: "products per stock/enrich run (1-25)"
        default: ""
        required: false
      job_keyword:
        description: "override the job's search keyword for this run (when its own results run out)"
        default: ""
        required: false
      enrich_only:
        description: "yes = enrich products that are missing images/variants/weight, ignoring last check time"
        default: ""
        required: false
      repeat:
        description: "run the job list this many times in a row (enrichment moves 25 products per pass)"
        default: ""
        required: false
      reprice:
        description: "recompute air+sea prices for N products (empty = skip, 'all' = every product)"
        default: ""
        required: false
      stats:
        description: "live store stats: 'short' = totals+categories only, 'yes' = also list every job, 'no' = skip"
        default: "short"
        required: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Item, search, then server job
        env:
          BASE: ${{ github.event.inputs.base }}
          TOKEN: ${{ secrets.IMPORT_TOKEN }}
          ITEM: ${{ github.event.inputs.item_id }}
          KW: ${{ github.event.inputs.keyword }}
          JOB: ${{ github.event.inputs.job_id }}
          TR: ${{ github.event.inputs.translate }}
          ST: ${{ github.event.inputs.stats }}
          PG: ${{ github.event.inputs.pages }}
          FP: ${{ github.event.inputs.from_page }}
          MI: ${{ github.event.inputs.max_items }}
          EO: ${{ github.event.inputs.enrich_only }}
          RP: ${{ github.event.inputs.reprice }}
          RE: ${{ github.event.inputs.repeat }}
          JK: ${{ github.event.inputs.job_keyword }}
        run: |
          set -e
          post() { curl -s -o out.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-import-token: $TOKEN" -d "$1" "$BASE/api/source/$2"; }
          if [ -n "$ITEM" ] && [ "$ITEM" != "-" ]; then
            echo "=== item $ITEM"; code=$(post "{\"id\":\"$ITEM\"}" test); echo "HTTP $code"
            python3 -c "import json;d=json.load(open('out.json'));print('ok',d.get('ok'),'provider',d.get('provider'),'status',d.get('status'),'error',d.get('error'));print('url',d.get('url'));x=d.get('data') or {};print('title',x.get('title'));print('titleEn',x.get('titleEn'));print('price',x.get('priceCny'),'images',len(x.get('images') or []),'variants',len(x.get('variants') or []),'minQty',x.get('minQty'),'supplier',x.get('supplier'));print('variants sample',(x.get('variants') or [])[:4]);print('meta',json.dumps(d.get('meta'),ensure_ascii=False)[:1500]);print('raw',d.get('raw','')[:600])"
          fi
          if [ -n "$KW" ] && [ "$KW" != "-" ]; then
            # عدة كلمات مفصولة بـ | تُجرَّب واحدة واحدة: نعرف أيها يعطي نتائج قبل تشغيل مهمة كاملة
            IFS='|' read -ra KWS <<< "$KW"
            for KW in "${KWS[@]}"; do
            echo "=== search $KW"; code=$(post "$(python3 -c "import json,os;print(json.dumps({'kw':os.environ['KW']}))")" test); echo "HTTP $code"
            python3 -c "import json;d=json.load(open('out.json'));print('ok',d.get('ok'),'status',d.get('status'),'error',d.get('error'));print('url',d.get('url'));xs=d.get('data') or [];print('items',len(xs));[print('-',x.get('offerId'),x.get('priceCny'),(x.get('title') or '')[:40]) for x in xs[:3]]"
            done
          fi
          if [ -n "$JOB" ]; then
            for pass in $(seq 1 "${RE:-1}"); do
            for j in $(echo "$JOB" | tr ',' ' '); do
              echo "=== run job $j (pass $pass/${RE:-1})"
              extra=""
              [ -n "$PG" ] && extra="$extra,\"pages\":$PG"
              [ -n "$FP" ] && extra="$extra,\"from_page\":$FP"
              [ -n "$MI" ] && extra="$extra,\"max_items\":$MI"
              [ "$EO" = "yes" ] && extra="$extra,\"enrich_only\":true"
              [ -n "$JK" ] && extra="$extra,\"keyword\":$(python3 -c "import json,os;print(json.dumps(os.environ['JK']))")"
              # دفعة واحدة قد تتجاوز مهلة الـ Worker (curl 56)؛ لا نوقف بقية الدفعات بسببها
              code=$(post "{\"job_id\":$j,\"limit\":1$extra}" run) || { echo "انقطع الاتصال في هذه الدفعة، نكمل"; sleep 10; continue; }
              echo "HTTP $code"
              python3 -c "import json;d=json.load(open('out.json'));r=(d.get('results') or [{}])[0];print(' ',r.get('job'),'|',r.get('status'),'| صفحات',r.get('pages'),'| وُجد',r.get('found'),'| جديد',r.get('imported'),'| مُثرى',r.get('enriched'),'| مكرر',r.get('dupes'),'|',r.get('note',''))" 2>/dev/null || cat out.json
              sleep 5
            done
            done
          fi
          if [ -n "$RP" ]; then
            n=$RP; only=true; after=0
            [ "$RP" = "all" ] && { n=600; only=false; }
            for i in $(seq 1 20); do
              echo "=== reprice batch $i (after_id=$after)"
              code=$(post "{\"limit\":$n,\"only_missing_sea\":$only,\"after_id\":$after}" reprice) || { echo "انقطع الاتصال، نكمل"; sleep 5; continue; }
              echo "HTTP $code"; cat out.json; echo
              after=$(python3 -c "import json;print(json.load(open('out.json')).get('last_id',0))")
              # نكمل ما دامت الدفعة أعادت صفوفًا؛ كلا الوضعين يتوقف وحده عند النفاد
              python3 -c "import json,sys;sys.exit(0 if json.load(open('out.json')).get('repriced',0)>0 else 1)" || break
              sleep 2
            done
          fi
          if [ -n "$TR" ]; then
            stall=0
            for i in $(seq 1 40); do
              echo "=== translate batch $i (limit $TR)"
              code=$(post "{\"limit\":$TR}" translate) || { echo "انقطع الاتصال، نكمل"; sleep 5; continue; }
              echo "HTTP $code"; cat out.json; echo
              # نتوقف حين لا يبقى عنوان صيني، أو حين تمرّ ثلاث دفعات بلا تقدّم (العناوين تتناوب بعدّاد المحاولات)
              python3 -c "import json,sys;d=json.load(open('out.json'));sys.exit(0 if d.get('remaining',0)>0 else 1)" || break
              if python3 -c "import json,sys;d=json.load(open('out.json'));sys.exit(0 if (d.get('products',0) or d.get('variants',0)) else 1)"; then stall=0; else stall=$((stall+1)); fi
              [ "$stall" -ge 3 ] && { echo "ثلاث دفعات بلا تقدّم — نتوقف"; break; }
              sleep 2
            done
          fi
          if [ -n "$ST" ] && [ "$ST" != "no" ]; then
            echo "=== store stats"; code=$(post '{}' stats); echo "HTTP $code"
            python3 -c "import json;d=json.load(open('out.json'));t=d.get('totals') or {};print('products',t.get('products'),'| active',t.get('active'),'| out of stock',t.get('outOfStock'),'| chinese titles',t.get('chineseTitles'),'| held draft',t.get('heldDraft'),'| provider calls',t.get('providerCalls'));print('--- categories (fewest first)');[print(f\"{c['active'] or 0:5} active {c['total'] or 0:5} total {c['chinese'] or 0:3} cn {c['draft'] or 0:4} draft {c['hidden_home'] or 0:4} hidden {'HOME' if c['show_home'] else '----'}  {c['slug']:28} {c['name_ar']}\") for c in d.get('categories') or []];jobs=d.get('jobs') or [];print(f'--- jobs: {len(jobs)} ({sum(1 for j in jobs if j[\"last_run_at\"])} شغّلت)')"
            if [ "$ST" = "yes" ]; then
              python3 -c "import json;d=json.load(open('out.json'));[print(f\"{j['id']:3} {'on ' if j['active'] else 'off'} {j['type']:6} {j['runner']:9} last={j['last_run_at']} {(j['name'] or '')[:26]} | {(j['last_summary'] or '')[:55]}\") for j in (d.get('jobs') or [])]"
            fi
          fi
