name = "dlal"
main = "src/index.tsx"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# يجب أن يبقى صريحًا: بمجرد إضافة نطاق خاص (routes) يُطفئ wrangler عنوان workers.dev ما لم يُذكر هنا —
# وحدث ذلك فعلًا عند ربط hudhude.com (٢٤/٠٩/٢٦). الإضافة وفحوص ما بعد النشر وروابط ماي باي تستخدمه.
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dlal-db"
database_id = "b45c2ed9-976b-4c4f-a9ae-162b8664fdaf"

# R2 (فعّله صاحب المشروع ٢٤/٠٩/٢٦، والحاوية أُنشئت من موصّل Cloudflare): صور مراحل الطلب من لوحة الشريك
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hudhude-media"

# Workers AI — ترجمة عناوين المنتجات من الصينية إلى العربية عند الاستيراد
[ai]
binding = "AI"

[vars]
SITE_NAME = "هدهدي"
SITE_URL = "https://hudhude.com"
DEFAULT_CURRENCY = "LYD"

# Secrets (wrangler secret put ...):
#   ADMIN_PASSWORD   كلمة مرور الأدمن الأولى
#   SESSION_SECRET   سر توقيع الجلسات
#   IMPORT_TOKEN     رمز أداة الاستيراد من المتصفح
#   MYPAY_API_KEY         مفتاح API لماي باي (اختياري — يتقدم على قيمة لوحة الإدارة)
#   MYPAY_WEBHOOK_SECRET  سر توقيع ويبهوك ماي باي (اختياري — يتقدم على قيمة لوحة الإدارة)

[triggers]
crons = ["0 * * * *"]   # مزامنة المخزون كل ساعة (تعمل فقط بعد ضبط مزوّد API)

# النطاق الخاص (اشتراه صاحب المشروع من Cloudflare في ٢٤/٠٩/٢٦). Custom Domain ينشئ سجل DNS
# والشهادة تلقائيًا. www يحوّل إلى الجذر في src/index.tsx. dlal.tsallabi.workers.dev يبقى يعمل
# (الإضافة وفحوص ما بعد النشر تستخدمه).
[[routes]]
pattern = "hudhude.com"
custom_domain = true

[[routes]]
pattern = "www.hudhude.com"
custom_domain = true
