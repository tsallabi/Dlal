name = "dlal"
main = "src/index.tsx"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dlal-db"
database_id = "b45c2ed9-976b-4c4f-a9ae-162b8664fdaf"

# R2 لتخزين الصور — فعّل R2 من لوحة Cloudflare ثم أزل التعليق وأنشئ الدلو: wrangler r2 bucket create dlal-images
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "dlal-images"

# Workers AI — ترجمة عناوين المنتجات من الصينية إلى العربية عند الاستيراد
[ai]
binding = "AI"

[vars]
SITE_NAME = "دلال"
SITE_URL = "https://dlal.ly"
DEFAULT_CURRENCY = "LYD"

# Secrets (wrangler secret put ...):
#   ADMIN_PASSWORD   كلمة مرور الأدمن الأولى
#   SESSION_SECRET   سر توقيع الجلسات
#   IMPORT_TOKEN     رمز أداة الاستيراد من المتصفح
#   MYPAY_API_KEY         مفتاح API لماي باي (اختياري — يتقدم على قيمة لوحة الإدارة)
#   MYPAY_WEBHOOK_SECRET  سر توقيع ويبهوك ماي باي (اختياري — يتقدم على قيمة لوحة الإدارة)

[triggers]
crons = ["0 * * * *"]   # مزامنة المخزون يوميًا 3 صباحًا UTC (تعمل فقط بعد ربط الـ API)
