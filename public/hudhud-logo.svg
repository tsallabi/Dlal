<g class="f" style="--c:96deg;--o:5deg" transform="translate(86 70) rotate(5)"><use href="#feather" transform="scale(1.04)"/></g>
<g class="f" style="--c:102deg;--o:26deg" transform="translate(86 70) rotate(26)"><use href="#feather" transform="scale(1.0)"/></g>
<g class="f" style="--c:108deg;--o:47deg" transform="translate(86 70) rotate(47)"><use href="#feather" transform="scale(0.92)"/></g>
<g class="f" style="--c:114deg;--o:68deg" transform="translate(86 70) rotate(68)"><use href="#feather" transform="scale(0.82)"/></g>
