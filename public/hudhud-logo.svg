  <path d="M186,124 L194,127 L192,143 L184,140 Z" fill="#fff"/>
</g>
<g class="body">
  <path d="M86,112 C86,90 110,84 133,90 C160,97 172,112 166,128 C160,147 131,157 107,151 C90,146 84,131 86,112 Z" fill="#D9823F"/>
