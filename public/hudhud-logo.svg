  <g clip-path="url(#wclip)" fill="#fff"><rect x="120" y="80" width="5.5" height="70" transform="rotate(18 120 115)"/>
<rect x="131" y="80" width="5.5" height="70" transform="rotate(18 131 115)"/>
<rect x="142" y="80" width="5.5" height="70" transform="rotate(18 142 115)"/>
<rect x="153" y="80" width="5.5" height="70" transform="rotate(18 153 115)"/>
<rect x="164" y="80" width="5.5" height="70" transform="rotate(18 164 115)"/>
<rect x="175" y="80" width="5.5" height="70" transform="rotate(18 175 115)"/></g>
</g>
<g class="head">
  <g class="f" style="--c:78deg;--o:-58deg" transform="translate(86 70) rotate(-58)"><use href="#feather" transform="scale(0.8)"/></g>
